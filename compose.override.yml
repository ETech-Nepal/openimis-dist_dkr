# Etech IMIS overrides. Docker Compose loads this file automatically on top of
# compose.yml, so upstream compose files stay untouched and merge cleanly.

# Keep the project name fixed: named volumes (photos, redis, OpenSearch) are
# prefixed with it. The database is NOT in a named volume yet; see
# etech-docs/DOCKER-FLOW.md before any `docker compose down`.
name: openimis-dist_dkr

services:
  frontend:
    image: etech-imis-fe:${ETECH_FE_TAG:-25.10-etech.1}
  # Stock upstream backend until an Etech backend module is built from source;
  # then set ETECH_BE_IMAGE=etech-imis-be:<tag> in .env (see etech-docs/FORKING-GUIDE.md).
  backend:
    image: ${ETECH_BE_IMAGE:-ghcr.io/openimis/openimis-be:25.10}
  worker:
    image: ${ETECH_BE_IMAGE:-ghcr.io/openimis/openimis-be:25.10}
